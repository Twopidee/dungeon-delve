name: Build Windows exe

# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0),
# or by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release and upload the exe

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller==6.11.1

      - name: Build Dungeon-Delve.exe
        run: pyinstaller --onefile --console --name Dungeon-Delve --icon icon.ico dungeon_delve.py

      - name: Smoke test (open the main menu and quit)
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          printf '3\n' | ./dist/Dungeon-Delve.exe | tee out.txt
          grep -q "Farewell, adventurer." out.txt

      - uses: actions/upload-artifact@v7
        with:
          name: Dungeon-Delve-windows
          path: dist/Dungeon-Delve.exe

      - name: Attach exe to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Dungeon-Delve.exe
          generate_release_notes: true
